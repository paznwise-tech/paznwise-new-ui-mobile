<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Icon: dark rounded square with dot-grid pattern -->
  <rect x="0" y="0" width="80" height="80" rx="14" ry="14" fill="#0D1B2A"/>

  <!-- Dot grid pattern — 4×4 grid, top-left 3×3 filled, bottom-right accents -->
  <!-- Row 1 -->
  <rect x="12" y="12" width="10" height="10" rx="2" fill="#C9A84C"/>
  <rect x="26" y="12" width="10" height="10" rx="2" fill="#C9A84C"/>
  <rect x="40" y="12" width="10" height="10" rx="2" fill="#C9A84C"/>
  <rect x="54" y="12" width="10" height="10" rx="2" fill="#1E3A5F"/>

  <!-- Row 2 -->
  <rect x="12" y="26" width="10" height="10" rx="2" fill="#C9A84C"/>
  <rect x="26" y="26" width="10" height="10" rx="2" fill="#C9A84C"/>
  <rect x="40" y="26" width="10" height="10" rx="2" fill="#1E3A5F"/>
  <rect x="54" y="26" width="10" height="10" rx="2" fill="#1E3A5F"/>

  <!-- Row 3 -->
  <rect x="12" y="40" width="10" height="10" rx="2" fill="#C9A84C"/>
  <rect x="26" y="40" width="10" height="10" rx="2" fill="#1E3A5F"/>
  <rect x="40" y="40" width="10" height="10" rx="2" fill="#1E3A5F"/>
  <rect x="54" y="40" width="10" height="10" rx="2" fill="#C9A84C"/>

  <!-- Row 4 -->
  <rect x="12" y="54" width="10" height="10" rx="2" fill="#1E3A5F"/>
  <rect x="26" y="54" width="10" height="10" rx="2" fill="#1E3A5F"/>
  <rect x="40" y="54" width="10" height="10" rx="2" fill="#C9A84C"/>
  <rect x="54" y="54" width="10" height="10" rx="2" fill="#C9A84C"/>

  <!-- App name text -->
  <text
    x="96"
    y="52"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="34"
    font-weight="900"
    letter-spacing="3"
    fill="#FFFFFF"
  >PAZNWISE</text>
</svg>
