<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon — square with rounded corners -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#0D1B2A"/>

  <!-- 4×4 dot grid, centered, each cell ~88px with 24px gap -->
  <!-- Col positions: 88, 180, 272, 364  Row positions: 88, 180, 272, 364 -->

  <!-- Row 1 -->
  <rect x="88"  y="88"  width="80" height="80" rx="14" fill="#C9A84C"/>
  <rect x="180" y="88"  width="80" height="80" rx="14" fill="#C9A84C"/>
  <rect x="272" y="88"  width="80" height="80" rx="14" fill="#C9A84C"/>
  <rect x="364" y="88"  width="80" height="80" rx="14" fill="#1E3A5F"/>

  <!-- Row 2 -->
  <rect x="88"  y="180" width="80" height="80" rx="14" fill="#C9A84C"/>
  <rect x="180" y="180" width="80" height="80" rx="14" fill="#C9A84C"/>
  <rect x="272" y="180" width="80" height="80" rx="14" fill="#1E3A5F"/>
  <rect x="364" y="180" width="80" height="80" rx="14" fill="#1E3A5F"/>

  <!-- Row 3 -->
  <rect x="88"  y="272" width="80" height="80" rx="14" fill="#C9A84C"/>
  <rect x="180" y="272" width="80" height="80" rx="14" fill="#1E3A5F"/>
  <rect x="272" y="272" width="80" height="80" rx="14" fill="#1E3A5F"/>
  <rect x="364" y="272" width="80" height="80" rx="14" fill="#C9A84C"/>

  <!-- Row 4 -->
  <rect x="88"  y="364" width="80" height="80" rx="14" fill="#1E3A5F"/>
  <rect x="180" y="364" width="80" height="80" rx="14" fill="#1E3A5F"/>
  <rect x="272" y="364" width="80" height="80" rx="14" fill="#C9A84C"/>
  <rect x="364" y="364" width="80" height="80" rx="14" fill="#C9A84C"/>
</svg>
