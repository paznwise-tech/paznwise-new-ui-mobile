<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Dark rounded square background -->
  <rect x="0" y="0" width="80" height="80" rx="14" ry="14" fill="#0D1B2A"/>

  <!-- Dot grid 4×4 (dimmed so P stands out) -->
  <!-- Row 1 -->
  <rect x="12" y="12" width="10" height="10" rx="2" fill="#C9A84C" opacity="0.35"/>
  <rect x="26" y="12" width="10" height="10" rx="2" fill="#C9A84C" opacity="0.35"/>
  <rect x="40" y="12" width="10" height="10" rx="2" fill="#C9A84C" opacity="0.35"/>
  <rect x="54" y="12" width="10" height="10" rx="2" fill="#1E3A5F" opacity="0.5"/>
  <!-- Row 2 -->
  <rect x="12" y="26" width="10" height="10" rx="2" fill="#C9A84C" opacity="0.35"/>
  <rect x="26" y="26" width="10" height="10" rx="2" fill="#C9A84C" opacity="0.35"/>
  <rect x="40" y="26" width="10" height="10" rx="2" fill="#1E3A5F" opacity="0.5"/>
  <rect x="54" y="26" width="10" height="10" rx="2" fill="#1E3A5F" opacity="0.5"/>
  <!-- Row 3 -->
  <rect x="12" y="40" width="10" height="10" rx="2" fill="#C9A84C" opacity="0.35"/>
  <rect x="26" y="40" width="10" height="10" rx="2" fill="#1E3A5F" opacity="0.5"/>
  <rect x="40" y="40" width="10" height="10" rx="2" fill="#1E3A5F" opacity="0.5"/>
  <rect x="54" y="40" width="10" height="10" rx="2" fill="#C9A84C" opacity="0.35"/>
  <!-- Row 4 -->
  <rect x="12" y="54" width="10" height="10" rx="2" fill="#1E3A5F" opacity="0.5"/>
  <rect x="26" y="54" width="10" height="10" rx="2" fill="#1E3A5F" opacity="0.5"/>
  <rect x="40" y="54" width="10" height="10" rx="2" fill="#C9A84C" opacity="0.35"/>
  <rect x="54" y="54" width="10" height="10" rx="2" fill="#C9A84C" opacity="0.35"/>

  <!-- Bold "P" overlaid in the center -->
  <text
    x="40"
    y="56"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="58"
    font-weight="900"
    text-anchor="middle"
    fill="#C9A84C"
  >P</text>
</svg>
